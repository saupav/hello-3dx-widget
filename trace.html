<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drop to Trace</title>
  <meta name="apiVersion" content="1.0" />
  <meta name="author" content="Saulius Pavalkis" />
  <meta name="description" content="Drop a requirement, test or work item from another widget and see its traceability chain and coverage (Smart Irrigation Controller sample)." />
  <meta name="debugMode" content="true" />
  <link rel="icon" type="image/png" href="https://saupav.github.io/hello-3dx-widget/trace-icon.png" />
  <link rel="richIcon" type="image/png" href="https://saupav.github.io/hello-3dx-widget/trace-richicon.png" />
  <widget:preferences>
    <widget:preference name="dataUrl" type="text" label="Trace data URL (JSON)" defaultValue="https://saupav.github.io/hello-3dx-widget/trace.json" />
    <widget:preference name="jiraBase" type="text" label="Work item base URL (optional, e.g. https://your-site.atlassian.net/browse/)" defaultValue="" />
    <widget:preference name="showLog" type="boolean" label="Show the event log" defaultValue="false" />
  </widget:preferences>
  <style type="text/css">
    /* Tokens live on body and .wrap, not :root: the UWA engine rewrites selectors into its container. */

      padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
    .wrap { display: flex; flex-direction: column; gap: 10px; max-width: 900px; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .between { justify-content: space-between; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    .tile { background: #ffffff; border: 1px solid #d5dde5; border-radius: 6px; padding: 8px 10px; }
    .tile .k { color: var(--muted, #5f6f7d); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tile .v small { font-size: 12px; font-weight: 400; color: var(--muted, #5f6f7d); }
    .drop { border: 2px dashed #0a6ed1; border-radius: 8px; padding: 18px 14px; text-align: center; background: #ffffff; color: #0a6ed1; font-weight: 600; transition: background .15s; }
    .drop.over { background: #e3f0fc; border-style: solid; }
    .drop .hint { display: block; font-weight: 400; color: var(--muted, #5f6f7d); margin-top: 4px; font-size: 12px; }
    input.txt { font: inherit; padding: 6px 8px; border: 1px solid #c3ced8; border-radius: 4px; background: #ffffff; color: var(--fg, #1c2730); min-width: 0; flex: 1 1 200px; }
    button { font: inherit; padding: 5px 11px; border-radius: 4px; border: 1px solid #0a6ed1; background: #0a6ed1; color: #ffffff; cursor: pointer; }
    button.secondary { background: transparent; color: #0a6ed1; }
    button.chip { background: #ffffff; color: #1c2730; border: 1px solid #c3ced8; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
    button.chip:hover { border-color: #0a6ed1; color: #0a6ed1; }

    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .list li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

    .list .st { font-size: 11px; color: #5f6f7d; border: 1px solid #c3ced8; border-radius: 3px; padding: 0 4px; }

    .crumbs { font-size: 12px; color: var(--muted, #5f6f7d); }
    .crumbs .lnk { color: #0a6ed1; cursor: pointer; }
    pre { font-family: var(--font-mono); font-size: 11px; margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
    .hidden { display: none; }
  </style>
  <script type="text/javascript">
  //<![CDATA[
  (function () {

      tile(t, 'Test cases', counts['Test case'] || 0);

          var hit = byId[history[h].toUpperCase()];

          if (hit === it) { c.appendChild(el('span', '', shortId(hit))); } else { c.appendChild(linkTo(hit, shortId(hit))); }

        r.appendChild(c);

      var card = el('div', 'card');
      var top = el('div', 'row');
      top.appendChild(el('span', 'id', shortId(it)));
      top.appendChild(el('span', 'badge kind', it.kind));
      if (it.status) { top.appendChild(el('span', 'badge kind', it.status)); }
      if (it.coverage) {

      card.appendChild(el('h3', '', it.name));

        var pa = el('p', ''); pa.appendChild(a); card.appendChild(pa);
      }
      r.appendChild(card);
      var cols = el('div', 'cols');
      cols.appendChild(column('Upstream (what this traces to)', it.up, 'up'));
      var groups = groupDown(it.down);
      var order = [['derives from', 'Derived software requirements'], ['satisfies', 'Architecture blocks that satisfy it'], ['verifies', 'Test cases that verify it'], ['covers', 'Work items that cover it']];
      var any = false;
      for (var g = 0; g < order.length; g++) { if (groups[order[g][0]]) { cols.appendChild(column(order[g][1], groups[order[g][0]], 'down')); any = true; } }
      if (!any) { cols.appendChild(column('Downstream', [], 'down')); }
      r.appendChild(cols);
      if (it.coverage && !it.coverage.covered) {
        r.appendChild(el('p', 'gap', 'Gap: ' + shortId(it) + ' has no ' + it.coverage.missing.join(' and no ') + ' (rule: ' + it.coverage.rule + ').'));

    }
    function groupDown(down) {
      var g = {}; for (var i = 0; i < down.length; i++) { (g[down[i].rel] = g[down[i].rel] || []).push(down[i]); } return g;
    }
    function column(title, links, dir) {
      var p = el('div', 'panel'); p.appendChild(el('h2', '', title));
      if (!links || !links.length) { p.appendChild(el('p', 'empty', 'none')); return p; }
      var ul = el('ul', 'list');
      for (var i = 0; i < links.length; i++) {
        var t = byId[links[i].id.toUpperCase()]; if (!t) { continue; }
        var li = el('li');
        li.appendChild(linkTo(t, shortId(t) + ' ' + t.name));
        li.appendChild(el('span', 'rel', dir === 'up' ? links[i].rel : t.kind));
        if (t.status) { li.appendChild(el('span', 'st', t.status)); }
        if (t.coverage) { li.appendChild(el('span', 'badge ' + (t.coverage.covered ? 'ok' : 'bad'), t.coverage.covered ? 'covered' : 'gap')); }
        ul.appendChild(li);
      }
      p.appendChild(ul); return p;
    }

  </script>
</head>
<body>
<div class="wrap">
  <div class="row between">
    <div>
      <h1>Drop to Trace</h1>
      <p class="sub" id="sample">Loading trace data&#8230;</p>
    </div>
    <button id="toggle-log" class="secondary" type="button">Log</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="drop" id="drop">
    Drop a requirement, test case or work item here
    <span class="hint" id="dropstate">Drag it from another widget on this tab, for example the Requirements or Bookmark widget</span>
  </div>

  <div class="panel">
    <div class="row">
      <input type="text" class="txt" id="q" list="names" placeholder="or search: SIC-SW-007, Flow Guard, TC-04, Leak protection" />
      <datalist id="names"></datalist>
      <button id="go" type="button">Trace</button>
    </div>
    <div class="row" style="margin-top: 8px">
      <span class="sub">Try:</span>
      <button class="chip" type="button" data-id="SIC-SYS-004">SIC-SYS-004 Leak protection</button>
      <button class="chip" type="button" data-id="SIC-SW-007">SIC-SW-007 (no test)</button>
      <button class="chip" type="button" data-id="SIC-SW-011">SIC-SW-011 (no work item)</button>
      <button class="chip" type="button" data-id="BLK:Flow Guard">Flow Guard</button>
      <button class="chip" type="button" data-id="TC-04">TC-04</button>
    </div>
  </div>

  <div class="panel" id="result">
    <p class="empty">Nothing traced yet. Drop an object above or pick an example.</p>
  </div>

  <div class="panel hidden" id="logpanel">
    <h2>Event log</h2>
    <pre id="log">booting&#8230;</pre>
  </div>
</div>
</body>
</html>
